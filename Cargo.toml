[workspace]
resolver = "3"
members = ["crates/*", "e2e", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/KimSoungRyoul/ag-ui-rust"
keywords = ["ag-ui", "agent", "llm", "protocol"]
categories = ["web-programming", "asynchronous"]

[workspace.dependencies]
# ---- internal ----
ag-ui-core = { path = "crates/ag-ui-core", version = "0.1.0" }
ag-ui-server = { path = "crates/ag-ui-server", version = "0.1.0" }
ag-ui-client = { path = "crates/ag-ui-client", version = "0.1.0" }
ag-ui-a2ui = { path = "crates/ag-ui-a2ui", version = "0.1.0" }

# ---- runtime: core (must stay minimal) ----
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }

# ---- runtime: server / client (executor-agnostic) ----
futures-core = "0.3.34"
futures-channel = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
json-patch = "4.2.0"
jsonptr = "0.8.1"

# ---- runtime: web binding (tokio enters here only) ----
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt", "sync", "macros"] }
tokio-util = "0.7.19"
tower = "0.5.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "charset", "http2"] }

# ---- optional runtime (feature-gated) ----
schemars = "1.2.2"
utoipa = "5.5.0"
prost = "0.14.4"
bytes = "1.12.1"

# ---- compile-time only (proc-macro / dev) ----
thiserror = "2.0.20"
tracing = "0.1.44"
insta = { version = "1", features = ["json"] }
tokio-test = "0.4"

[profile.release]
lto = "thin"
