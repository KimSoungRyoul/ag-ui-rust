[workspace]
resolver = "3"
members = ["crates/*", "e2e", "examples/*", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/KimSoungRyoul/ag-ui-rust"
keywords = ["ag-ui", "agent", "llm", "protocol"]
categories = ["web-programming", "asynchronous"]

[workspace.dependencies]
# ---- internal ----
# Two published crates. The protocol types, the server runtime, the client
# runtime and the axum binding are one crate behind features, because in Rust
# features — not crate splits — are how you keep a dependency out of a build.
# A2UI stays separate: it is a different protocol, usable with no AG-UI at all,
# and its users should not have to depend on `ag-ui` to reach it.
ag-ui = { path = "crates/ag-ui", version = "0.2.0" }
ag-ui-a2ui = { path = "crates/ag-ui-a2ui", version = "0.2.0" }

# ---- runtime: core (must stay minimal) ----
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }

# ---- runtime: server / client (executor-agnostic) ----
futures-core = "0.3.34"
futures-channel = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
json-patch = "4.2.0"
jsonptr = "0.8.1"

# ---- runtime: web binding (tokio enters here only) ----
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt", "sync", "macros"] }
tower = "0.5.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "charset", "http2"] }

# ---- optional runtime (feature-gated) ----
schemars = "1.2.2"
utoipa = "5.5.0"

# ---- compile-time only (proc-macro / dev) ----
thiserror = "2.0.20"
insta = { version = "1", features = ["json"] }

[profile.release]
lto = "thin"
