name: CI

on:
  push:
    branches: [main, build]
  pull_request:
  schedule:
    # Upstream freshness needs the network, so it runs on a timer rather than
    # as a required check. Monday morning, off the hour to dodge the rush.
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # File hygiene and formatting, driven by prek — a drop-in pre-commit
  # replacement that is a single Rust binary. CI and the contributor's own
  # pre-commit hook run the same hooks out of the same
  # `.pre-commit-config.yaml`, so anyone who has run `prek install` cannot
  # produce a commit this job then rejects.
  #
  # `cargo fmt --all -- --check` lives here, as the config's `cargo-fmt` hook,
  # rather than in the `test` job below: one formatting gate, in the one place a
  # contributor also runs it. Two consequences worth knowing before editing
  # this job — the Rust toolchain is load-bearing (the hook shells out to
  # `cargo fmt`, and without rustfmt it fails rather than skips), and deleting
  # the job removes formatting from CI altogether.
  #
  # Clippy is deliberately not here. The config puts it on the pre-push stage,
  # which `prek run` does not reach by default, so it stays in `test` where it
  # shares that job's compilation cache instead of paying for its own.
  hygiene:
    name: hygiene (prek)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # The action prepends `--show-diff-on-failure --color=always` to
      # `extra-args`, so a fixer hook's changes are printed as a diff rather
      # than merely reported as a failure.
      - uses: j178/prek-action@v3.0.0
        with:
          prek-version: "0.4.14"
          extra-args: --all-files

  test:
    name: test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # `cargo test`, not `cargo nextest run`. nextest does not run doctests at
      # all, and a large part of what this workspace proves lives in them: every
      # crate README, the workspace quickstart, and — in
      # crates/ag-ui-server/src/emit/mod.rs — the `compile_fail` example that is
      # the only executable proof of the typestate guarantee docs/DESIGN.md
      # sells as a headline feature. The local loop is nextest, so "535 tests
      # pass" locally silently excludes all of that.
      - run: cargo test --workspace --all-features
      # Deliberately redundant with the line above. If someone ever swaps that
      # for `cargo nextest run` to buy speed, this step is what keeps the
      # doctests running instead of vanishing without a failing build.
      - run: cargo test --doc --workspace --all-features

  # `compile_fail` doctests may name the error they expect
  # (```compile_fail,E0499```). Stable rustdoc parses that annotation and then
  # ignores it: the example need only fail to compile, for any reason at all.
  # Verified by putting `E0308` — mismatched types, nothing to do with the
  # borrow-check example it labels — on the emit/mod.rs doctest, which still
  # passed on stable and failed on nightly with "Some expected error codes were
  # not found". So a typo that makes the example fail for an unrelated reason
  # reads as a pass on stable, and the guarantee quietly stops being tested.
  #
  # This job is what makes those annotations mean something. It is the only use
  # of nightly in CI; if nightly churn ever makes it more trouble than it is
  # worth, delete the job rather than dropping the error codes.
  doctest-error-codes:
    name: doctest error codes (nightly)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --doc --workspace --all-features

  # The design guarantees core/server/client stay executor-agnostic.
  executor-agnostic:
    name: executor-agnostic (no tokio below the web binding)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # Building for wasm proves the crates carry no native-only assumptions.
      - run: cargo check -p ag-ui-core --target wasm32-unknown-unknown --no-default-features
      - run: cargo check -p ag-ui-core --target wasm32-unknown-unknown --all-features
      - run: cargo check -p ag-ui-server --target wasm32-unknown-unknown --all-features
      - run: cargo check -p ag-ui-client --target wasm32-unknown-unknown --no-default-features
      - run: cargo check -p ag-ui-a2ui --target wasm32-unknown-unknown --all-features

      # ...but it does NOT prove the tokio ban, which is the actual commitment in
      # docs/DESIGN.md ("Executor-agnostic below the web binding"). tokio's `rt`,
      # `sync`, `macros`, `io-util` and `time` features all compile for
      # wasm32-unknown-unknown, so adding `tokio.workspace = true` to
      # ag-ui-server's [dependencies] passes every check above. Verified by
      # doing exactly that: the wasm build stayed green.
      #
      # The dependency graph is what carries the guarantee, so assert on that.
      # `-e normal` excludes dev-dependencies, which may use tokio freely.
      - name: tokio is absent from the dependency graph
        run: |
          set -uo pipefail
          status=0
          forbid_tokio() {
            crate="$1"; shift
            echo "--- $crate $* ---"
            tree=$(cargo tree -p "$crate" -e normal --prefix none --no-dedupe "$@") || exit 2
            # No `grep -q`: an early close would SIGPIPE `cargo tree` and, under
            # pipefail, turn a real hit into a silent pass.
            if printf '%s\n' "$tree" | grep -E '^tokio v'; then
              echo "::error title=Executor-agnostic violation::$crate depends on tokio. docs/DESIGN.md keeps core/server/client on futures primitives (futures::channel::mpsc, not tokio::sync::mpsc) so wasm and non-tokio executors stay viable. tokio belongs in ag-ui-axum and nowhere else. Move the dependency, or change the design doc first."
              status=1
            fi
          }
          forbid_tokio ag-ui-core --all-features
          forbid_tokio ag-ui-server --all-features
          forbid_tokio ag-ui-a2ui --all-features
          # `http` deliberately pulls reqwest, which pulls tokio; the crate is
          # executor-agnostic only with that feature off.
          forbid_tokio ag-ui-client --no-default-features
          exit $status

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every feature alone and every crate with its defaults off. A powerset
      # would be 2^4 for core alone and would not buy much: the features are
      # additive and independent. `--all-targets` so feature-gated tests are
      # compiled too, not just the library.
      - run: cargo check --all-targets -p ag-ui-core --no-default-features
      - run: cargo check --all-targets -p ag-ui-core --no-default-features --features sse
      - run: cargo check --all-targets -p ag-ui-core --no-default-features --features protobuf
      - run: cargo check --all-targets -p ag-ui-core --no-default-features --features schemars
      - run: cargo check --all-targets -p ag-ui-core --no-default-features --features utoipa
      - run: cargo check --all-targets -p ag-ui-core --all-features
      - run: cargo check --all-targets -p ag-ui-server --no-default-features
      - run: cargo check --all-targets -p ag-ui-server --all-features
      - run: cargo check --all-targets -p ag-ui-client --no-default-features
      - run: cargo check --all-targets -p ag-ui-client --all-features
      - run: cargo check --all-targets -p ag-ui-a2ui --no-default-features
      - run: cargo check --all-targets -p ag-ui-a2ui --no-default-features --features toolkit
      - run: cargo check --all-targets -p ag-ui-a2ui --no-default-features --features ag-ui
      - run: cargo check --all-targets -p ag-ui-a2ui --all-features
      - run: cargo check --all-targets -p ag-ui-axum

  # `rust-version = "1.85"` is a promise to anyone pinning an older toolchain,
  # and edition 2024 stabilised in exactly 1.85, so there is no slack in it.
  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets

  # The public API is the product, so a broken intra-doc link is a defect in the
  # deliverable rather than a cosmetic warning.
  docs:
    name: docs
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps

      # `-D warnings` above does not cover this, which is why it needs its own
      # step. `--no-deps` cannot emit a path into a crate it is not documenting
      # and does not say so: a cross-crate intra-doc link silently renders as the
      # literal text `[Name]`, and the `[text](path)` form silently renders as
      # `href="path"`, which looks like a link and 404s. Neither is a warning, so
      # nothing anywhere asked — 31 of them had accumulated across all five
      # crates, including nine copies of `RunAgentInput`, before anyone looked.
      #
      # Two better fixes were measured and rejected; they are recorded here so
      # nobody re-derives them:
      #
      #   * Documenting dependencies (dropping `--no-deps`) resolves every link
      #     and costs 454M across 142 crate directories instead of 24M across 9 —
      #     127 other projects' documentation published under our /api/.
      #   * `--extern-html-root-url` is the mechanism rustdoc provides for exactly
      #     this, and it is nightly-only: it demands `-Z unstable-options`. This
      #     repo runs nightly for one check job and says to drop that job if the
      #     churn stops paying; the published documentation is a larger promise.
      #
      # So a reference to one of our own crates is written as an absolute link to
      # the published rustdoc, and this step keeps it that way. A reference to a
      # third-party crate stays plain text: that is simply what `--no-deps` does,
      # and the type is still named.
      - name: references to our own crates are links, not text
        run: |
          dirs=(target/doc/ag_ui_core target/doc/ag_ui_server target/doc/ag_ui_client target/doc/ag_ui_axum target/doc/ag_ui_a2ui)

          # A grep over a directory that does not exist finds nothing, which
          # would read as a pass. Every failure mode of this check is silent
          # enough already; refuse to report on a tree that is not all there.
          for d in "${dirs[@]}"; do
            if [ ! -d "$d" ]; then
              echo "::error::$d is missing — the docs build did not produce what this check reads"
              exit 2
            fi
          done

          # Every item this workspace documents, read off the rustdoc filenames
          # so the check needs no hand-kept list of type names and cannot drift
          # from the API. `Action` is the one exclusion: we define
          # `ag_ui_a2ui::message::Action`, and an inlined upstream doc comment
          # mentions an unrelated `Action::Follow` that would otherwise match. It
          # is the only collision among 245 names.
          names=$(find "${dirs[@]}" \
              \( -name 'struct.*.html' -o -name 'enum.*.html' -o -name 'trait.*.html' \
                 -o -name 'fn.*.html' -o -name 'type.*.html' \) \
            | sed -E 's#.*/(struct|enum|trait|fn|type)\.([^./]+)\.html$#\2#' \
            | grep -vxF 'Action' | sort -u | paste -sd'|' -)

          rc=0

          text=$(grep -rhoE "\[<code>($names)(::[A-Za-z0-9_]+)*</code>\]" "${dirs[@]}" | sort | uniq -c)
          if [ -n "$text" ]; then
            echo "$text"
            echo "::error::the docs name one of our own items without linking to it; use an absolute https://kimsoungryoul.github.io/ag-ui-rust/api/ link"
            rc=1
          fi

          href=$(grep -rhoE 'href="ag_ui_[a-z_]*::[^"]*"' "${dirs[@]}" | sort | uniq -c)
          if [ -n "$href" ]; then
            echo "$href"
            echo "::error::those hrefs are Rust paths rather than URLs and will 404; use an absolute https://kimsoungryoul.github.io/ag-ui-rust/api/ link"
            rc=1
          fi

          exit $rc

  # The same configurations the `features` job checks, documented instead of
  # compiled — because those two jobs between them could not see this class of
  # bug at all. A doc link to an item a feature compiled out is a rustdoc
  # *error*, not a dead link; `cargo check` never resolves doc links, and the
  # `docs` job only ever builds `--all-features`, which is the one configuration
  # where every gated target exists. So nothing asked the question, and 17 such
  # links had accumulated across core, client and a2ui by the time anything did.
  #
  # Mirrors `features` deliberately: if the two disagree about which
  # configurations are supported, one of them is wrong. Two omissions, both
  # because they buy nothing here — `--all-features` (the `docs` job above
  # already builds it, and it cannot exercise a gated doc link) and
  # `ag-ui-axum` (no features to vary).
  doc-features:
    name: docs (feature matrix)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps -p ag-ui-core --no-default-features
      - run: cargo doc --no-deps -p ag-ui-core --no-default-features --features sse
      - run: cargo doc --no-deps -p ag-ui-core --no-default-features --features protobuf
      - run: cargo doc --no-deps -p ag-ui-core --no-default-features --features schemars
      - run: cargo doc --no-deps -p ag-ui-core --no-default-features --features utoipa
      - run: cargo doc --no-deps -p ag-ui-server --no-default-features
      - run: cargo doc --no-deps -p ag-ui-client --no-default-features
      - run: cargo doc --no-deps -p ag-ui-a2ui --no-default-features
      - run: cargo doc --no-deps -p ag-ui-a2ui --no-default-features --features toolkit
      - run: cargo doc --no-deps -p ag-ui-a2ui --no-default-features --features ag-ui

  # Every published crate must carry the metadata and files crates.io needs, and
  # must not ship anything it should not. `--list` is offline and does not
  # publish; it is the cheapest way to notice a README that stopped being
  # packaged or a stray file that started being.
  package:
    name: package manifest
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: every published crate packages its README and LICENSE
        run: |
          set -uo pipefail
          status=0
          for crate in ag-ui-core ag-ui-server ag-ui-client ag-ui-axum ag-ui-a2ui; do
            echo "--- $crate ---"
            files=$(cargo package --list -p "$crate") || exit 2
            printf '%s\n' "$files"
            for required in README.md LICENSE; do
              if ! printf '%s\n' "$files" | grep -Fxq "$required"; then
                echo "::error title=Missing from package::$crate would publish without $required. crates.io renders the README as the crate's front page; without it the page is blank."
                status=1
              fi
            done
          done
          exit $status

  # The community SDK fell behind because the port was hand-written with no
  # mechanical link to upstream. This job is that link.
  #
  # Offline and deterministic: it compares the vendored baseline against the
  # Rust source and never opens a socket, so it cannot be reddened by a network
  # blip. Exit 1 is drift; exit 2 is a missing baseline or a moved event module,
  # which is a genuine repo defect and should fail too.
  drift:
    name: protocol drift vs upstream
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- drift-check

  # The other half of the link: is the *baseline* still current? This one does
  # hit GitHub, so it is scheduled rather than required. `--upstream` keeps the
  # offline verdict and merely reports when the fetch fails, so a rate limit or
  # an outage cannot fail the run either — only real upstream movement can.
  upstream-freshness:
    name: upstream freshness (scheduled)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- drift-check --upstream
        env:
          # Lifts the 60-requests/hour/IP unauthenticated limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
