name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Every other run gets
# a group of its own, so runs on main are neither cancelled nor queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  audit:
    uses: ./.github/workflows/audit.yml

  # The hooks a contributor's pre-commit runs, from the same config. This is
  # CI's only `cargo fmt` gate, hence rustfmt. Clippy is a pre-push hook, which
  # `prek run` skips, so it runs in `test`.
  hygiene:
    name: hygiene (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: j178/prek-action@v3.1.0
        with:
          prek-version: "0.5.10"
          extra-args: --all-files

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Not nextest: it skips doctests, and much of what this workspace proves
      # lives in them, including the crate READMEs, the quickstart and the
      # `compile_fail` typestate proof in crates/ag-ui/src/server/emit/mod.rs.
      # `--all-targets` leaves doctests out, so they run exactly once, below.
      - run: cargo test --workspace --all-features --all-targets
      - run: cargo test --doc --workspace --all-features

  semantic-interop:
    name: official TypeScript schema semantics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/interop/package-lock.json
      - run: npm ci --ignore-scripts --prefix e2e/interop
      - run: npm test --prefix e2e/interop

  # Stable rustdoc ignores the code in ```compile_fail,E0499```: any compile
  # failure passes, so an example broken by a typo still reads as green.
  # Nightly enforces the code. If nightly churn ever outweighs that, delete
  # this job, not the error codes.
  doctest-error-codes:
    name: doctest error codes (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --doc --workspace --all-features

  # docs/DESIGN.md: everything below the `axum` feature is executor-agnostic.
  executor-agnostic:
    name: executor-agnostic (no tokio below the web binding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # No native-only assumptions. Per feature, because `axum` may be native.
      - run: cargo check -p ag-ui --target wasm32-unknown-unknown --no-default-features
      - run: cargo check -p ag-ui --target wasm32-unknown-unknown --no-default-features --features sse,protobuf,schemars,utoipa
      - run: cargo check -p ag-ui --target wasm32-unknown-unknown --no-default-features --features server,verify,sse
      - run: cargo check -p ag-ui --target wasm32-unknown-unknown --no-default-features --features client,sse
      - run: cargo check -p ag-ui-a2ui --target wasm32-unknown-unknown --all-features

      # The wasm build cannot prove the tokio ban: tokio's rt, sync, macros,
      # io-util and time features all build for wasm32. Features also unify, so
      # one `dep:tokio` on `server` would reach every consumer. Assert on the
      # graph instead; `-e normal` lets dev-dependencies use tokio.
      - name: tokio is absent from the dependency graph
        run: |
          set -euo pipefail
          status=0
          forbid_tokio() {
            echo "--- $* ---"
            tree=$(cargo tree -p "$@" -e normal --prefix none --no-dedupe)
            if grep -E '^tokio v' <<<"$tree"; then
              echo "::error title=Executor-agnostic violation::$* depends on tokio. Below the \`axum\` feature the crates stay on futures primitives so wasm and other executors work (docs/DESIGN.md). Move the dependency, or change the design first."
              status=1
            fi
          }
          forbid_tokio ag-ui --no-default-features
          forbid_tokio ag-ui --no-default-features --features sse,protobuf,schemars,utoipa
          forbid_tokio ag-ui --no-default-features --features server,verify,sse
          forbid_tokio ag-ui --no-default-features --features client,sse
          forbid_tokio ag-ui-a2ui --all-features
          # `http` (reqwest) and `axum` (tokio) are the documented exceptions.
          exit $status

  # Each feature alone, defaults off, and everything on. The features are
  # additive, so a powerset would buy little. `--all-targets` compiles
  # feature-gated tests too.
  features:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets -p ag-ui --no-default-features
      - run: cargo check --all-targets -p ag-ui --no-default-features --features sse
      - run: cargo check --all-targets -p ag-ui --no-default-features --features protobuf
      - run: cargo check --all-targets -p ag-ui --no-default-features --features schemars
      - run: cargo check --all-targets -p ag-ui --no-default-features --features utoipa
      - run: cargo check --all-targets -p ag-ui --no-default-features --features server
      - run: cargo check --all-targets -p ag-ui --no-default-features --features server,verify,sse
      - run: cargo check --all-targets -p ag-ui --no-default-features --features client
      - run: cargo check --all-targets -p ag-ui --no-default-features --features http
      - run: cargo check --all-targets -p ag-ui --no-default-features --features axum
      - run: cargo check --all-targets -p ag-ui --features axum
      - run: cargo check --all-targets -p ag-ui --all-features
      - run: cargo check --all-targets -p ag-ui-a2ui --no-default-features
      - run: cargo check --all-targets -p ag-ui-a2ui --no-default-features --features toolkit
      - run: cargo check --all-targets -p ag-ui-a2ui --no-default-features --features ag-ui
      - run: cargo check --all-targets -p ag-ui-a2ui --no-default-features --features schema-validation
      - run: cargo check --all-targets -p ag-ui-a2ui --no-default-features --features author
      - run: cargo check --all-targets -p ag-ui-a2ui --no-default-features --features ag-ui-server
      - run: cargo check --all-targets -p ag-ui-a2ui --all-features
      # Every other test run compiles the ordering verifier in. This one runs
      # the server without it, so what holds "even when `verify` is disabled"
      # is executed, not only compiled.
      - run: cargo test -p ag-ui --no-default-features --features server,sse

  # Each example built alone, the way `cargo run -p <example>` builds it.
  # Inside the workspace, cargo unifies features across members (e2e and
  # review-desk turn on `ag-ui-a2ui/ag-ui`), so an example that uses a feature
  # it never enables stays green everywhere else. Checked twice, because
  # dev-dependencies unify too: the plain check sees only the package's own
  # `[dependencies]`, and `--all-targets` then covers its tests. Packages are
  # read off `examples/`, so a new example is covered automatically.
  examples:
    name: examples (each package alone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: every example builds with only the features it enables
        run: |
          set -euo pipefail
          packages=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.workspace_root as $root | .packages[]
                | select(.manifest_path | startswith($root + "/examples/")) | .name')
          # An empty list would check nothing and pass.
          if [ -z "$packages" ]; then
            echo "::error::no packages found under examples/; this check would pass without checking anything"
            exit 2
          fi
          status=0
          check_alone() {
            echo "--- cargo check -p $* ---"
            if ! cargo check -p "$@"; then
              echo "::error title=Example does not build alone::cargo check -p $* failed. Built alone, an example gets only the features its own Cargo.toml enables; enable the one it uses on its own dependency line."
              status=1
            fi
          }
          for package in $packages; do
            check_alone "$package"
            check_alone "$package" --all-targets
          done
          exit $status

  renderer-interop:
    name: official A2UI renderer core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            examples/review-desk/interop/package-lock.json
            e2e/a2ui-interop/package-lock.json
      - run: npm ci --ignore-scripts --prefix examples/review-desk/interop
      - run: npm test --prefix examples/review-desk/interop
      - run: npm ci --ignore-scripts --prefix e2e/a2ui-interop
      - run: npm test --prefix e2e/a2ui-interop

  # Edition 2024 stabilised in exactly 1.85, so `rust-version` has no slack.
  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets

  # The public API is the product, so a broken intra-doc link is a defect.
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps

      # Invisible to `-D warnings`: under `--no-deps` a link into another crate
      # renders as the literal text `[Name]`, and `[text](path)` renders as an
      # href that 404s. So links to our own crates are absolute URLs into the
      # published rustdoc, and this step enforces that. The alternatives cost
      # more: without `--no-deps`, ~140 dependency crates would be published
      # under /api/, and `--extern-html-root-url` is nightly-only.
      - name: references to our own crates are links, not text
        # No pipefail: grep finding nothing is the passing case.
        run: |
          dirs=(target/doc/ag_ui target/doc/ag_ui_a2ui)
          # A grep over a missing directory finds nothing, which reads as a pass.
          for d in "${dirs[@]}"; do
            [ -d "$d" ] || { echo "::error::$d is missing; the docs build did not produce it"; exit 2; }
          done

          # Every documented item, read off rustdoc's file names so the list
          # cannot drift from the API. `Action` is excluded: an inlined upstream
          # doc comment names an unrelated `Action::Follow`.
          names=$(find "${dirs[@]}" \
              \( -name 'struct.*.html' -o -name 'enum.*.html' -o -name 'trait.*.html' \
                 -o -name 'fn.*.html' -o -name 'type.*.html' \) \
            | sed -E 's#.*/(struct|enum|trait|fn|type)\.([^./]+)\.html$#\2#' \
            | grep -vxF 'Action' | sort -u | paste -sd'|' -)

          # Under `axum`, tokio-util's `FutureExt` docs are inlined onto our
          # `Cancelled` and link to tokio-util's own `CancellationToken`.
          # Excluded by exact text so that our `CancellationToken` stays covered.
          inlined='\[<code>CancellationToken::run_until_cancelled(_owned)?</code>\]'

          rc=0
          text=$(grep -rhoE "\[<code>($names)(::[A-Za-z0-9_]+)*</code>\]" "${dirs[@]}" \
            | grep -vE "$inlined" | sort | uniq -c)
          if [ -n "$text" ]; then
            echo "$text"
            echo "::error::the docs name one of our own items without linking to it; use an absolute https://kimsoungryoul.github.io/ag-ui-rust/api/ link"
            rc=1
          fi

          # Both crate names: `ag_ui::…` and `ag_ui_a2ui::…` (note the digit).
          href=$(grep -rhoE 'href="ag_ui(_[a-z0-9_]+)?::[^"]*"' "${dirs[@]}" | sort | uniq -c)
          if [ -n "$href" ]; then
            echo "$href"
            echo "::error::those hrefs are Rust paths rather than URLs and will 404; use an absolute https://kimsoungryoul.github.io/ag-ui-rust/api/ link"
            rc=1
          fi
          exit $rc

  # The `features` configurations, documented instead of compiled. A doc link
  # to an item that a feature compiled out is a rustdoc error, and neither
  # `cargo check` nor the all-features `docs` job ever resolves it.
  doc-features:
    name: docs (feature matrix)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps -p ag-ui --no-default-features
      - run: cargo doc --no-deps -p ag-ui --no-default-features --features sse
      - run: cargo doc --no-deps -p ag-ui --no-default-features --features protobuf
      - run: cargo doc --no-deps -p ag-ui --no-default-features --features schemars
      - run: cargo doc --no-deps -p ag-ui --no-default-features --features utoipa
      - run: cargo doc --no-deps -p ag-ui --no-default-features --features server
      - run: cargo doc --no-deps -p ag-ui --no-default-features --features server,verify,sse
      - run: cargo doc --no-deps -p ag-ui --no-default-features --features client
      - run: cargo doc --no-deps -p ag-ui --no-default-features --features http
      - run: cargo doc --no-deps -p ag-ui --no-default-features --features axum
      - run: cargo doc --no-deps -p ag-ui-a2ui --no-default-features
      - run: cargo doc --no-deps -p ag-ui-a2ui --no-default-features --features toolkit
      - run: cargo doc --no-deps -p ag-ui-a2ui --no-default-features --features ag-ui
      - run: cargo doc --no-deps -p ag-ui-a2ui --no-default-features --features schema-validation
      - run: cargo doc --no-deps -p ag-ui-a2ui --no-default-features --features author
      - run: cargo doc --no-deps -p ag-ui-a2ui --no-default-features --features ag-ui-server

  # The skills, plugin manifests and sources.md restate the version, the
  # README's dependency blocks and repository paths by hand, and nothing
  # compiles them. Offline; the rules are in xtask/src/docs_check.rs.
  docs-consistency:
    name: docs consistency (skills, plugin, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -p xtask -- docs-check

  # crates.io renders the README as the crate's front page. `--list` is
  # offline and the cheapest way to catch a file that stopped being packaged.
  package:
    name: package manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: every published crate packages its README and LICENSE
        run: |
          set -euo pipefail
          status=0
          for crate in ag-ui ag-ui-a2ui; do
            echo "--- $crate ---"
            files=$(cargo package --list -p "$crate")
            echo "$files"
            for required in README.md LICENSE; do
              if ! grep -Fxq "$required" <<<"$files"; then
                echo "::error title=Missing from package::$crate would publish without $required"
                status=1
              fi
            done
          done
          exit $status

  # Offline: the Rust protocol types (events and every other $defs shape) and
  # the vendored 1.0 schema against the reviewed baseline. `--local` covers
  # everything plain `drift-check` does. The networked check is scheduled.yml.
  drift:
    name: protocol drift vs upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -p xtask -- drift-check --local
