name: Dependency security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      # Fetch current RustSec advisories, including on unchanged daily builds.
      # Do not suppress advisories or accept yanked dependencies.
      - run: cargo audit --deny warnings
