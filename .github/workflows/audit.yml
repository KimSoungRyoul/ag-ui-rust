name: Dependency security

# Daily, so a new RustSec advisory surfaces even when the code has not changed.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.23.0
      # No suppressed advisories, no accepted yanked dependencies.
      - run: cargo audit --deny warnings
