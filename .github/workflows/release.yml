name: Release

# A version tag is verified and becomes a GitHub Release. A dispatch runs the
# same checks on a branch without releasing. Uploading to crates.io stays a
# human step (publish.yml), because the registry has no undo; this workflow
# checks everything it can on the exact commit the tag names.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  audit:
    uses: ./.github/workflows/audit.yml

  release:
    needs: audit
    name: verify and release
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release note is the log since the previous tag
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Everything after this, the release note and the upload, inherits the
      # tag's number, so a tag that disagrees with Cargo.toml stops here.
      - name: the tag matches the workspace version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tagged=${GITHUB_REF_NAME#v}
          declared=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "ag-ui") | .version')
          echo "tag $tagged, workspace $declared"
          if [ "$tagged" != "$declared" ]; then
            echo "::error title=Version mismatch::the tag says $tagged and Cargo.toml says $declared"
            exit 1
          fi

      # CI's gates, on the tagged commit itself.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --all-targets
      - run: cargo test --doc --workspace --all-features
      - run: cargo run --locked -p xtask -- drift-check --local

      # Selecting both lets Cargo resolve the companion against the packaged
      # SDK even before the SDK appears in the crates.io index.
      - name: package rehearsal
        run: cargo publish --locked --dry-run -p ag-ui -p ag-ui-a2ui

      # The note says how to publish, because the release exists before the
      # crates are on crates.io.
      - name: the release note
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "## Changes${previous:+ since $previous}"
            echo
            git log --no-merges --pretty='- %s' "${previous:+$previous..}$TAG"
            cat <<EOF

          ## Publishing

          Verified on this commit: clippy, workspace tests, doctests, protocol drift,
          and a publish dry run that built both packaged crates. Publish the verified
          release from this exact tag using the trusted-publisher workflow:

          \`\`\`sh
          gh workflow run publish.yml --ref $TAG -f dry_run=true
          # After reviewing the dry run and explicitly approving publication:
          gh workflow run publish.yml --ref $TAG -f dry_run=false
          \`\`\`
          EOF
          } > release-note.md

          flags=()
          if [[ ${TAG#v} == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" --title "$TAG" --notes-file release-note.md --verify-tag "${flags[@]}"
