name: Publish

# Uploads the crates to crates.io when a release is published by hand, or when
# dispatched with dry_run unticked. A release that release.yml creates with
# GITHUB_TOKEN does not trigger this workflow.
#
# crates.io has no undo, so everything checkable is checked before the upload,
# and a version that is already published is skipped rather than retried.
#
# No API token is stored. crates.io Trusted Publishing trades this run's OIDC
# token for a publish token that lasts 30 minutes, and only because each
# crate's Trusted Publisher entry names this repository and `publish.yml`.
on:
  release:
    types: [published]
  # A rehearsal, or finishing a release whose upload failed halfway. A dry run
  # still authenticates, so it proves the credential too.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify without uploading"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  audit:
    uses: ./.github/workflows/audit.yml

  publish:
    needs: audit
    name: publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token crates.io trades for a publish token
    env:
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A release can be cut by hand from any commit, so the tag is checked
      # again here, the last place a wrong number is still free to fix.
      - name: the version to publish
        id: version
        run: |
          set -euo pipefail
          declared=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "ag-ui") | .version')
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tagged=${GITHUB_REF_NAME#v}
            echo "tag $tagged, workspace $declared"
            if [ "$tagged" != "$declared" ]; then
              echo "::error title=Version mismatch::the release tag says $tagged and Cargo.toml says $declared"
              exit 1
            fi
          elif [ "$DRY_RUN" = true ]; then
            echo "no tag; dry run of the checkout's version $declared"
          else
            echo "::error title=Tag required::real publication must run from a version tag"
            exit 1
          fi

      # The release workflow ran these on the tag, but a release made by hand
      # from an unverified commit reaches this job without them.
      - run: cargo test --workspace --all-features --all-targets
      - run: cargo test --doc --workspace --all-features

      # Scoped by the Trusted Publisher entries; revoked in the post step.
      - name: authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # ag-ui first: ag-ui-a2ui depends on it by version, and `cargo publish`
      # waits for the index to catch up. A version already on crates.io is
      # skipped, so a re-run finishes a half-done release instead of failing.
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            echo "::notice title=Dry run::authenticated; packaging and verifying, uploading nothing"
          fi

          published() {
            local code
            code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -A "ag-ui-rust publish workflow" \
              "https://crates.io/api/v1/crates/$1/$VERSION")
            case $code in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "::error::crates.io answered HTTP $code for $1 $VERSION"; exit 1 ;;
            esac
          }

          for crate in ag-ui ag-ui-a2ui; do
            if published "$crate"; then
              echo "::notice title=Already published::$crate $VERSION is on crates.io; skipping"
            elif [ "$DRY_RUN" != true ]; then
              cargo publish -p "$crate"
            elif [ "$crate" = ag-ui ] || published ag-ui; then
              cargo publish --dry-run -p "$crate"
            else
              cargo package --list -p "$crate" >/dev/null
              echo "::notice title=Dry run::the ag-ui-a2ui registry check waits for ag-ui $VERSION"
            fi
          done
