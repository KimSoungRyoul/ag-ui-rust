name: Pages

# The guide (website/) and the workspace rustdoc are one site: the guide links
# into /api/, so both are built in one job and shipped as one artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The scopes that publish are granted to the deploy job alone, so nothing a
# pull request reaches runs with them.
permissions:
  contents: read

# Per ref. Superseded pull-request builds are cancelled. A deploy is never
# cancelled midway, since that could leave a partial upload live.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything up to and including the artifact runs on pull requests too, so
  # a broken docs build is red before it lands.
  build:
    name: build (site + rustdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Starlight's `lastUpdated` reads each page's date from `git log`; a
          # shallow clone would stamp every page with the deploy date.
          fetch-depth: 0

      # Before setup-node, whose `cache: pnpm` runs pnpm. Pinned here because
      # website/package.json has no `packageManager`. pnpm 10+ would also need
      # esbuild's build script approved.
      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 26 # the active LTS line
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: install site dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: check guide types
        run: pnpm check
        working-directory: website

      # Checks page bodies, navigation and Markdown links. Links into the API
      # are checked once the rustdoc is in place, below.
      - name: build the guide
        run: pnpm build
        working-directory: website

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The same command and flags as ci.yml's `docs` job, so the site never
      # ships rustdoc that CI would have rejected.
      - name: build the rustdoc
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # rustdoc links are all relative, so it can be served from /ag-ui-rust/api/.
      # A workspace `cargo doc` writes no top-level index.html, so the
      # hand-written landing page is copied after the merge, where it wins.
      - name: place the rustdoc at /ag-ui-rust/api/
        run: |
          mkdir -p website/dist/api
          cp -R target/doc/. website/dist/api/
          cp website/public/api/index.html website/dist/api/index.html

      - name: the artifact contains both a guide and a rustdoc
        run: |
          status=0
          check() {
            if [ ! -s "$1" ]; then
              echo "::error title=Missing from the Pages artifact::$1 is absent or empty, so the site would 404 there. $2"
              status=1
            fi
          }
          check website/dist/index.html "The Astro build produced no home page."
          check website/dist/api/index.html "The rustdoc landing page did not survive the copy."
          for crate in ag_ui ag_ui_a2ui; do
            check "website/dist/api/$crate/index.html" "cargo doc did not document $crate."
          done
          exit $status

      - name: validate guide links against the bundled rustdoc
        working-directory: website
        run: node scripts/verify-build.mjs --with-api

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    # Never from a pull request, and a dispatch from another branch builds
    # without publishing.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # A job's `permissions` replaces the workflow's rather than merging with
    # it, so `contents: read` is restated.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Here rather than in `build`: it fails when Pages is not enabled, which
      # should fail the deploy, not every pull request. Its outputs are unused,
      # because astro.config.ts sets `site` and `base` itself.
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
