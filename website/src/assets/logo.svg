<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ag-ui-rust">
  <!--
    A run: one origin bar, then events streaming away from it to the right.

    Drawn in `currentColor` so a single file serves both themes, but Starlight
    renders the site logo inside an `<img>`, and an SVG loaded as an image is
    its own document — it cannot inherit the page's colour, and it never sees
    Starlight's theme toggle. The style block below is what keeps the mark
    visible in that context: it resolves `currentColor` against the operating
    system's colour scheme, which is what the toggle defaults to.
  -->
  <style>
    svg { color: #1a1a1e; }
    @media (prefers-color-scheme: dark) { svg { color: #f4f4f5; } }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 8v16" />
    <path d="M12 10l6 6-6 6" />
    <path d="M21.5 12.5l3.5 3.5-3.5 3.5" />
  </g>
</svg>
