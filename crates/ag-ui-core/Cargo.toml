[package]
name = "ag-ui-core"
description = "Core protocol types, events, and wire encoding for the AG-UI protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# The optional features are most of the public surface, so docs.rs must build
# them all or the rendered API is a subset of the real one.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["sse"]
# Server-Sent Events framing. No extra dependencies.
sse = []
# Binary transport: the media type and content negotiation only. There is no
# encoder — events.proto covers 18 of the protocol's 33 event types, so encoding
# would drop events silently. See `encode::protobuf`. Deliberately pulls in no
# dependency: it would be a `prost` build for a module that never calls it.
protobuf = []
# Opt-in schema derives (see ag-ui-protocol/ag-ui#1407).
schemars = ["dep:schemars"]
utoipa = ["dep:utoipa"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
schemars = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
