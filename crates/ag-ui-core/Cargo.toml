[package]
name = "ag-ui-core"
description = "Core protocol types, events, and wire encoding for the AG-UI protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# The optional features are most of the public surface, so docs.rs must build
# them all or the rendered API is a subset of the real one.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["sse"]
# Server-Sent Events framing. No extra dependencies.
sse = []
# Binary transport. NOTE: events.proto only covers 18 of 32 event types.
protobuf = ["dep:prost", "dep:bytes"]
# Opt-in schema derives (see ag-ui-protocol/ag-ui#1407).
schemars = ["dep:schemars"]
utoipa = ["dep:utoipa"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
prost = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
