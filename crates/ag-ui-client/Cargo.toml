[package]
name = "ag-ui-client"
description = "Client-side AG-UI runtime: consume a remote agent's event stream and materialize messages and state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["http"]
# reqwest-backed HTTP transport. Disable for wasm or custom transports.
http = ["dep:reqwest"]

[dependencies]
ag-ui-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures-core.workspace = true
futures-util.workspace = true
json-patch.workspace = true
reqwest = { workspace = true, optional = true }

[dev-dependencies]
# Integration tests are their own crates: they see the library's public API and
# these, not the library's own dependencies.
ag-ui-core.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
