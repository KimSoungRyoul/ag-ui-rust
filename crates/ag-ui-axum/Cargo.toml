[package]
name = "ag-ui-axum"
description = "Axum binding for AG-UI agents: one router extension mounts the canonical POST + SSE endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
ag-ui-core.workspace = true
ag-ui-server.workspace = true
axum.workspace = true
# `time` is for the optional SSE keep-alive; the rest comes from the workspace.
tokio = { workspace = true, features = ["time"] }
futures-util.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Only the tests use it, and only to prove the loop closes: what this endpoint
# writes to the socket is what an AG-UI client reads back off it.
ag-ui-client.workspace = true
# `net` and `io-util` for the raw HTTP/1.1 client in tests/http.rs, `time` for
# its timeouts.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
# `oneshot` in the crate-level doctest, so the example needs no port.
tower = { workspace = true, features = ["util"] }
