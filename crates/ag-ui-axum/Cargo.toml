[package]
name = "ag-ui-axum"
description = "Axum binding for AG-UI agents: one router extension mounts the canonical POST + SSE endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ag-ui-core.workspace = true
ag-ui-server.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tower = { workspace = true, features = ["util"] }
axum = { workspace = true, features = ["macros"] }
http-body-util = "0.1"
