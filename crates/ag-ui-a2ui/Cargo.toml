[package]
name = "ag-ui-a2ui"
description = "A2UI (Agent-to-UI) protocol types, semantic validator, and agent-side authoring toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
# Sets the `docsrs` cfg the crate reads to label feature-gated items.
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The agent layer is how A2UI is authored, so it is what a dependency with no
# features named gets.
default = ["agent"]
# The framework-neutral agent layer: catalog negotiation, the prompt snippet,
# reading a model's answer whole or streamed, renderer state, the retry
# decision. Protocol modules only; no model call, executor or network.
agent = []
# The conventions of an agent hosted on AG-UI: the operations envelope, op
# builders, the generate and render tools, a surface recovered from history.
# History finds blocks the way the agent layer does.
toolkit = ["agent"]
# Full Draft 2020-12 validation with local resources only.
schema-validation = ["dep:jsonschema", "dep:schema-getrandom"]
# One surface created or edited by a model, held to the JSON Schemas: the
# agent layer with a fixed target.
author = ["agent", "schema-validation"]
# AG-UI event emission; does not enable HTTP, axum, or Tokio.
ag-ui-server = ["author", "ag-ui", "ag-ui/server"]
# Interop with `ag-ui`: history entries from AG-UI messages, toolkit tool
# definitions as offerable tools. Implies `toolkit`, because everything it
# converts lives there. Turn it off to use A2UI standalone over A2A or MCP —
# which is the whole reason this is a separate crate rather than a feature of
# `ag-ui`.
ag-ui = ["dep:ag-ui", "toolkit"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jsonptr.workspace = true
# The `XID_Continue` table, which is what a name in a `formatString` template is
# made of. No dependencies of its own.
unicode-ident = "1.0.24"
jsonschema = { version = "=0.61.2", default-features = false, optional = true }
ag-ui = { workspace = true, optional = true }

# jsonschema's randomized hash maps require browser entropy on wasm. Kept
# target- and feature-specific, so standalone protocol users do not acquire it.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
schema-getrandom = { package = "getrandom", version = "=0.3.4", features = ["wasm_js"], optional = true }

[dev-dependencies]
# Reads the vendored upstream language-agnostic conformance suite
# (tests/conformance/**). Maintained fork of the deprecated `serde_yaml`.
serde_norway = "0.9.42"
