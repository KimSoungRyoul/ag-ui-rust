[package]
name = "ag-ui-a2ui"
description = "A2UI (Agent-to-UI) protocol types, semantic validator, and agent-side authoring toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
# Sets the `docsrs` cfg the crate reads to label feature-gated items.
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["ag-ui", "toolkit"]
# Agent-side authoring: op builders, prompt assembly, recovery loop.
toolkit = []
# Interop with `ag-ui`: history entries from AG-UI messages, toolkit tool
# definitions as offerable tools. Implies `toolkit`, because everything it
# converts lives there. Turn it off to use A2UI standalone over A2A or MCP —
# which is the whole reason this is a separate crate rather than a feature of
# `ag-ui`.
ag-ui = ["dep:ag-ui", "toolkit"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jsonptr.workspace = true
ag-ui = { workspace = true, optional = true }

[dev-dependencies]
# Reads the vendored upstream language-agnostic conformance suite
# (tests/conformance/**). Maintained fork of the deprecated `serde_yaml`.
serde_norway = "0.9.42"
