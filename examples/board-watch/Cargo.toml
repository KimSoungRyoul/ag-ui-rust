[package]
name = "board-watch"
description = "A terminal client for any AG-UI agent, and the awkward agent it is tested against. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The backend features — `server` and `axum` — are here only for `serve-fake`
# and the tests. The client itself needs neither, which is the point: `watch`
# talks to whatever is on the far end of a URL.
ag-ui = { workspace = true, features = ["client", "http", "server", "axum"] }
ag-ui-a2ui.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync"] }
axum.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# A second, independent backend to point the client at: the round-one example's
# agent, unmodified. A client that only ever talks to its own fake server has
# not been tested against anything.
task-board = { path = "../task-board" }
# `tests/live.rs` only, and only under `--ignored`: the round-one LLM agent, so
# the client can be pointed at a real streaming model without this crate
# growing a model client of its own.
ag-ui-e2e = { path = "../../e2e" }
