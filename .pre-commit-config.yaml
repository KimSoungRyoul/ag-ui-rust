# Pre-commit hygiene gate, run by prek (https://github.com/j178/prek) — a
# drop-in pre-commit replacement that is a single Rust binary, so contributors
# need no Python to use it. See the README for the two-command setup.
#
# Deliberately small. CI already owns fmt, clippy, tests, doctests, the feature
# matrix, MSRV, docs, the wasm/dependency-graph checks and the drift check, and
# repeating any of those here would only make every commit slower without
# catching anything new. What lives here is the cheap file hygiene that has no
# CI job at all, plus the two Rust gates worth catching before the code leaves
# the machine rather than ten minutes later on a runner.

# So that `prek install` wires up all three shims: the pre-push one is what
# runs clippy, and without it the clippy hook below would never fire locally;
# the prepare-commit-msg one is what prefixes a commit with its issue number.
default_install_hook_types: [pre-commit, pre-push, prepare-commit-msg]

# Hooks run at commit time unless they name another stage. Without this line a
# hook that names no stage runs at every installed one, so the file fixers below
# would be handed the commit message file at prepare-commit-msg and "fix" it.
# The price is that the hygiene hooks no longer repeat at push time, which loses
# nothing: they have already run on the same files at commit time.
default_stages: [pre-commit]

# Files this repo has promised not to touch. Every one of them is either copied
# from another project or written by a tool, and their worth depends on staying
# byte-identical to that source: the A2UI conformance suite and spec fixtures
# are diffed against upstream by hand on every re-copy, so each mechanical
# "improvement" here is noise in that diff forever; the insta snapshots are
# compared byte for byte by the tests themselves; the drift baseline is the
# protocol's own record. Found the hard way — the first run of this config
# quietly added a trailing newline to seventeen vendored fixtures.
#
# Whole directories rather than the vendored subtrees within them, so that a
# later re-copy that brings a new file is covered without anyone remembering to
# widen this. It also spares `check-json` the conformance suite's
# `bad_json/bad.json`, which is malformed on purpose because that is exactly
# what the parse-error case needs to be pointed at.
exclude: |
  (?x)^(
      crates/ag-ui-a2ui/tests/(conformance|spec_v0_9)/
    | crates/ag-ui-a2ui/schemas/
    | crates/ag-ui/tests/snapshots/
    | xtask/baseline/events\.json$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # prek reimplements this whole hook set natively (`prek util
      # list-builtins`), so none of these pull in a Python toolchain.
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        # Not `--fix=auto`, which would preserve a CRLF file that is already
        # consistently CRLF. The tree is LF throughout and should stay that way.
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      # Checks nothing today: every tracked .json belongs to one of the vendored
      # trees excluded above. Kept as the guard for the first JSON file this
      # repo actually owns, which would otherwise arrive unchecked.
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        # Nothing in the tree comes close. The vendored A2UI conformance
        # fixtures are the biggest files in the repo — 166 KiB at the top — and
        # they are excluded above, so this never sees them; the largest source
        # file it does see is crates/ag-ui-a2ui/src/core/validate.rs at 104 KiB,
        # and the largest of any kind is a 166 KiB lockfile. Pinned to the
        # upstream default rather than left implicit, so a change to that
        # default cannot start rejecting a file that has always been fine.
        args: [--maxkb=500]

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        # Upstream's default args are `[--write-changes, --force-exclude]`.
        # Reporting, not rewriting: a spelling fix inside Rust source renames an
        # identifier, and that is a change to read before applying, unlike the
        # whitespace fixers above. `--force-exclude` is kept so that _typos.toml
        # still applies when prek passes file paths explicitly.
        args: [--force-exclude]

  # Prefixes the commit subject with the issue number taken from the branch
  # name, and with the change type when the author did not write one:
  #
  #   branch   20-fix-subagents-key
  #   typed    read and write the 1.0 key
  #   commit   [#20] fix: read and write the 1.0 key
  #
  # A subject that already starts with a type keeps it, scope included, so
  # `fix(core): ...` becomes `[#20] fix(core): ...`. The hook only ever adds
  # text and never rejects a commit: on a branch whose name does not start with
  # an issue number it does nothing, and merge commits are left alone.
  #
  # `^[0-9]+` rather than the hook's default `#[0-9]{1,5}`, because the branches
  # here carry no `#`, and anchored so that a number elsewhere in a name
  # (`feat/pr2778-qa`) is never mistaken for an issue.
  - repo: https://github.com/KimSoungRyoul/commit-issue-prefix
    rev: v1.3.1
    hooks:
      - id: commit-issue-prefix
        args:
          - '--issue-regex=^[0-9]+'
          - '--template=[#{issue}]'
          - '--types=feat,fix,refactor,perf,docs,test,chore,ci,build,revert,style,i18n'

  - repo: local
    hooks:
      # Fast (no compilation), so it runs on every commit: formatting debt never
      # reaches a branch.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      # Slow enough to be resented on every commit, so it runs at push time
      # instead — still before CI sees the branch, which is the point. Cargo
      # manifests are in `types_or` because a dependency or feature edit can
      # break clippy with no .rs file touched at all.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push]
